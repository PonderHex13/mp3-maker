name: Build and Push MP3 Maker Image

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: wolf-debian13
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6
    
    # Login to GHCR (Updated to v4)
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build and Push (Updated to v6/v7)
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true  # This ensures it uploads
        tags: ghcr.io/ponderhex13/mp3-maker:latest,ghcr.io/ponderhex13/mp3-maker:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
