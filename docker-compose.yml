version: '3.8'

services:
  mp3-maker:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
      - ./input:/app/input
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - OUTPUT_DIR=/app/output
      - AUDIO_QUALITY=${AUDIO_QUALITY:-192}
      - FLASK_ENV=development
    stdin_open: true
    tty: true

  # CLI version for command line usage
  mp3-maker-cli:
    build: .
    volumes:
      - ./output:/app/output
      - ./input:/app/input
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - OUTPUT_DIR=/app/output
      - AUDIO_QUALITY=${AUDIO_QUALITY:-192}
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles: ["cli"]