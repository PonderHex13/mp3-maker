<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP3 Maker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>MP3 Maker</h1>
      <p>Turn songs and links into MP3s.</p>
    </header>

    <section class="panel submit-panel">
      <div class="input-heading">
        <label for="entries" class="label">Songs to convert</label>
        <span id="entryCount" class="entry-count" aria-live="polite">0 songs</span>
      </div>
      <p id="entryHelp" class="input-help">One entry per line: YouTube or Spotify track URL, or Artist - Song.</p>
      <textarea id="entries" rows="10" aria-describedby="entryHelp" placeholder="Queen - Hammer To Fall
https://www.youtube.com/watch?v=xPU8OAjjS4k
The Beatles - Help"></textarea>
      <p class="input-note">Spotify tracks are searched on YouTube; the result may differ.</p>
      <div class="actions">
        <span id="submitInfo" class="muted" role="status" aria-live="polite"></span>
        <button id="submitBtn" type="button">Convert songs</button>
      </div>
    </section>

    <section class="panel jobs-panel">
      <div class="jobs-header">
        <h2>All jobs</h2>
        <div class="jobs-header-actions">
          <div class="refresh-status"><span id="jobsInfo" class="muted" role="status" aria-live="polite"></span><button id="refreshBtn" class="text-button" type="button" hidden>Retry</button></div>
          <button id="clearHistoryBtn" class="danger" type="button" hidden>Remove All</button>
        </div>
      </div>
      <p id="historyInfo" class="muted history-info" role="status" aria-live="polite"></p>
      <div id="jobsContainer" class="jobs-container"></div>
    </section>
  </main>

  <dialog id="clearHistoryDialog" class="confirm-dialog" aria-labelledby="clearHistoryTitle" aria-describedby="clearHistoryMessage">
    <form method="dialog">
      <h2 id="clearHistoryTitle">Remove all jobs?</h2>
      <p id="clearHistoryMessage"></p>
      <div class="confirm-actions">
        <button class="secondary" type="submit" value="cancel">Cancel</button>
        <button class="danger" type="submit" value="confirm">Remove All</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
